# Cloud deployment overlay — merge with app-config.yaml:
#   yarn start --config ../../app-config.yaml --config ../../app-config.cloud.yaml
#
# For a local two-instance demo, run this on port 3001:
#   yarn workspace app start --config ../../app-config.yaml --config ../../app-config.cloud.yaml --port 3001
#
# Only app.baseUrl changes — the instance switcher, CD theme accent, and the
# wien:instance:current scaffolder action all resolve "cloud" by matching this
# baseUrl against the shared wien.instances registry in app-config.yaml.

app:
  baseUrl: http://localhost:3001

backend:
  baseUrl: http://localhost:7008
  listen:
    port: 7008

  cors:
    origin: http://localhost:3001
