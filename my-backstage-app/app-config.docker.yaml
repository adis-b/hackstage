# Docker overlay — merge when running the backend image via docker-compose.
# Local dev uses app-config.yaml (SQLite). Docker uses Postgres from compose.

backend:
  baseUrl: http://localhost:7007
  listen: ':7007'
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}

app:
  baseUrl: http://localhost:7007
